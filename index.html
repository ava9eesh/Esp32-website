<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 Emergency</title>
<style>
body{margin:0;background:#0b0b0b;color:#eee;font-family:Arial;
display:flex;justify-content:center;align-items:center;height:100vh}
.card{background:#111;padding:20px;border-radius:16px;width:300px;text-align:center}
.time{font-size:32px;margin-bottom:10px}
.yes{color:#ff4444}.no{color:#00ff88}
</style></head><body>
<div class="card">
<div class="time" id="t">--:--:--</div>
<div>Emergency: <span id="e" class="no">NO</span></div>
<p id="l"></p>
</div>
<script>
setInterval(()=>{
fetch('api/status').then(r=>r.json()).then(d=>{
t.textContent=d.time;
e.textContent=d.emergency?"YES":"NO";
e.className=d.emergency?"yes":"no";
l.textContent=d.location;
});
},1000);
</script></body></html>
