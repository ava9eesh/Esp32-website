<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 Emergency</title>

<style>
* {
  box-sizing: border-box;
  font-family: "Segoe UI", system-ui, sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #111 0%, #000 60%);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #eee;
}

.card {
  width: 340px;
  padding: 28px;
  border-radius: 18px;
  background: rgba(20, 20, 20, 0.85);
  box-shadow:
    0 0 40px rgba(0, 0, 0, 0.8),
    inset 0 0 0 1px rgba(255,255,255,0.05);
  text-align: center;
}

.time {
  font-size: 40px;
  font-weight: 600;
  letter-spacing: 1px;
  margin-bottom: 14px;
}

.status {
  font-size: 18px;
  margin-bottom: 10px;
}

.yes {
  color: #ff4d4d;
  text-shadow: 0 0 10px rgba(255, 77, 77, 0.6);
}

.no {
  color: #00ff88;
  text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
}

.location {
  font-size: 14px;
  opacity: 0.8;
  margin-top: 8px;
  line-height: 1.4;
}

.footer {
  margin-top: 18px;
  font-size: 11px;
  opacity: 0.4;
}
</style>
</head>

<body>
  <div class="card">
    <div id="time" class="time">--:--:--</div>
    <div class="status">
      Emergency:
      <span id="emg" class="no">NO</span>
    </div>
    <div id="loc" class="location">Loading location…</div>
    <div class="footer">ESP32 • Live Status</div>
  </div>

<script>
const timeEl = document.getElementById("time");
const emgEl  = document.getElementById("emg");
const locEl  = document.getElementById("loc");

async function update() {
  try {
    const res = await fetch("/api/status", {
      cache: "no-store"   // 🔥 THIS FIXES REFRESH ISSUE
    });
    const d = await res.json();

    timeEl.textContent = d.time || "--:--:--";

    if (d.emergency) {
      emgEl.textContent = "YES";
      emgEl.className = "yes";
    } else {
      emgEl.textContent = "NO";
      emgEl.className = "no";
    }

    locEl.textContent = d.location || "Unknown";
  } catch (err) {
    locEl.textContent = "Disconnected";
  }
}

// update immediately
update();

// update every second
setInterval(update, 1000);
  
let lastEmergency = false;

// Ask permission once
if ("Notification" in window) {
  if (Notification.permission !== "granted") {
    Notification.requestPermission();
  }
}

setInterval(() => {
  fetch('/api/status')
    .then(r => r.json())
    .then(d => {

      // Update UI (you already have this)
      document.getElementById("t").textContent = d.time;
      document.getElementById("e").textContent = d.emergency ? "YES" : "NO";
      document.getElementById("e").className = d.emergency ? "yes" : "no";
      document.getElementById("l").textContent = d.location;

      // 🔔 POP-UP NOTIFICATION
      if (d.emergency && !lastEmergency) {
        if (Notification.permission === "granted") {
          new Notification("🚨 Emergency Alert", {
            body: "Emergency button was pressed!",
          });
        }
      }

      lastEmergency = d.emergency;
    });
}, 1000);
</script>
</body>
</html>
